<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Iqra Baking Shop v1.0.0</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#D4880F">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#FFF9F0;--fg:#2C1810;--mt:#8B7355;--ac:#D4880F;--cd:#FFF;--bd:#E8D5B7;--sb:#1A0F07;--ok:#2E7D32;--no:#C62828;--wn:#E65100;--in:#00695C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden;overscroll-behavior:none}
::-webkit-scrollbar{width:0px;height:0px} 

.bt{transition: transform .1s ease, background .15s, border-color .15s; -webkit-user-select:none; user-select:none}
.bt:active{transform: scale(.95)}
.ni{transition: all .15s}
.ni:active{transform: scale(.97)}
.btm-item:active{transform: scale(.92)}

.sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;background:var(--sb);color:#F5E6D3;z-index:60;transition:transform .3s ease;overflow-y:auto;padding-bottom:20px;padding-top:env(safe-area-inset-top)}
.ni{display:flex;align-items:center;gap:11px;padding:14px 18px;margin:2px 10px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:500;color:rgba(245,230,211,.55)}
.ni:hover{background:#3E2723;color:#F5E6D3}
.ni.ac{background:linear-gradient(135deg,var(--ac),#B8740A);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(212,136,15,.3)}
.ni i{width:22px;text-align:center;font-size:16px}

.mc{margin-left:280px;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.tb{position:sticky;top:0;z-index:40;background:rgba(255,249,240,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;transition:box-shadow .25s;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.dt{width:100%;border-collapse:separate;border-spacing:0}
.dt th{background:#FDF6EC;padding:12px;text-align:left;font-weight:700;font-size:12px;color:var(--mt);border-bottom:2px solid var(--bd)}
.dt td{padding:12px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;border:none;font-family:inherit;white-space:nowrap}
.bp{background:linear-gradient(135deg,var(--ac),#B8740A);color:#fff;box-shadow:0 4px 12px rgba(212,136,15,.25)}
.bs{background:var(--cd);color:var(--fg);border:1px solid var(--bd)}
.bs:active{border-color:var(--ac)}
.bd{background:var(--no);color:#fff}
.bg{background:var(--ok);color:#fff}
.bi{background:var(--in);color:#fff}
.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:10px;font-size:15px;font-family:inherit;background:var(--cd);color:var(--fg);outline:none}
.fi:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,136,15,.1)}

.mo{position:fixed;inset:0;background:rgba(26,15,7,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.sh{opacity:1;pointer-events:auto}
.mb{background:var(--cd);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:100%;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1);box-shadow:0 -10px 30px rgba(0,0,0,.2);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.mo.sh .mb{transform:translateY(0)}
@media(min-width:769px){.mo{align-items:center}.mb{border-radius:20px;width:92%;max-width:540px;transform:scale(.95)}.mo.sh .mb{transform:scale(1)}}

.tc{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tt{padding:12px 16px;border-radius:10px;color:#fff;font-weight:500;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:ti .3s ease;pointer-events:auto}
@keyframes ti{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}

.lu{width:100px;height:100px;border-radius:24px;border:2px dashed rgba(212,136,15,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;flex-shrink:0;transition:all .2s}
.lu:active{transform:scale(.98)}
.lu img{width:100%;height:100%;object-fit:cover}
.lo{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.lu:active .lo{opacity:1}

/* বটম নেভিগেশন বার */
.btm-nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:none;justify-content:space-around;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.btm-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mt);cursor:pointer;flex:1;padding:4px;transition:color .2s}
.btm-item.active{color:var(--ac);font-weight:700}
.btm-item i{font-size:20px}

.ps{animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sbr{height:8px;border-radius:4px;background:#F0E6D6;overflow:hidden}
.sbf{height:100%;border-radius:4px;transition:width .4s}

/* স্ট্যাটাস লাইট (আপডেটেড ডিজাইন) */
.sd{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:6px}
.so{background:#2196F3;box-shadow:0 0 8px #2196F3;animation:pu 2s infinite}
.se{background:#f44336;box-shadow:0 0 8px #f44336;animation:pu 2s infinite}
.sw{background:#FF9800;box-shadow:0 0 8px #FF9800;animation:pu 1s infinite}

#printArea { display: none; }
@media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
    @page { margin: 1cm; }
}

@media(max-width:768px){
    .sidebar{width:260px;transform:translateX(-100%);z-index:70}
    .sidebar.op{transform:translateX(0)}
    .mc{margin-left:0;padding-bottom:70px} 
    .tb{padding:12px 16px}
    .pg{padding:14px!important}
    .sg{grid-template-columns:1fr 1fr!important}
    .rg{grid-template-columns:1fr!important}
    .dt{font-size:13px}
    .btm-nav{display:flex}
    .mt{display:flex!important} 
    .scrl{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media(min-width:769px){
    .mt{display:none!important}
    .mb-close{display:none}
}
</style>
</head>
<body>
<div class="tc" id="TC"></div>
<div id="printArea"></div>

<aside class="sidebar" id="SB">
<div style="padding:20px 16px 14px">
<div style="display:flex;align-items:center;gap:12px">
<div class="lu" onclick="document.getElementById('LF').click()">
<img id="LI" src="" alt="" style="display:none">
<i class="fas fa-bread-slice" id="LK" style="color:var(--ac);font-size:36px"></i>
<div class="lo"><i class="fas fa-camera" style="color:#fff;font-size:24px"></i></div>
</div>
<input type="file" id="LF" accept="image/*" style="display:none" onchange="hLogo(event)">
<div><div style="font-weight:900;font-size:22px;color:#FFF;line-height:1.1">Iqra</div><div style="font-size:12px;color:rgba(245,230,211,.5)">Baking Shop v1.0.0</div></div>
</div></div>
<div style="margin:10px 16px;border-bottom:1px solid rgba(245,230,211,.1)"></div>
<nav style="padding:10px 0">
<div class="ni ac" data-p="dashboard" onclick="go('dashboard')"><i class="fas fa-chart-pie"></i>ড্যাশবোর্ড</div>
<div class="ni" data-p="products" onclick="go('products')"><i class="fas fa-box"></i>পণ্য সমূহ</div>
<div class="ni" data-p="shops" onclick="go('shops')"><i class="fas fa-store"></i>দোকান সমূহ</div>
<div class="ni" data-p="sales" onclick="go('sales')"><i class="fas fa-cash-register"></i>বিক্রয়</div>
<div class="ni" data-p="purchases" onclick="go('purchases')"><i class="fas fa-cart-plus"></i>ক্রয়</div>
<div class="ni" data-p="stock" onclick="go('stock')"><i class="fas fa-warehouse"></i>স্টক</div>
<div class="ni" data-p="accounts" onclick="go('accounts')"><i class="fas fa-book"></i>হিসাব বই</div>
<div class="ni" data-p="reports" onclick="go('reports')"><i class="fas fa-file-invoice"></i>রিপোর্ট</div>
<div class="ni" data-p="settings" onclick="go('settings')"><i class="fas fa-gear"></i>সেটিংস</div>
</nav>
</aside>

<div class="mc">
<div class="tb">
<div style="display:flex;align-items:center;gap:12px;min-width:0">
<button class="mt bt bs sm" style="padding:8px 10px" onclick="document.getElementById('SB').classList.toggle('op')"><i class="fas fa-bars"></i></button>
<div style="min-width:0"><h1 style="font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="PT">ড্যাশবোর্ড</h1><p style="font-size:11px;color:var(--mt)" id="PS">সারসংক্ষেপ</p></div>
</div>
<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
<span id="SS2" style="display:flex;align-items:center;font-size:12px;color:var(--mt);font-weight:600"><span class="sd se"></span>অফলাইন</span>
<button class="bt bs sm" onclick="printFullReport()"><i class="fas fa-print"></i></button>
</div>
</div>
<div class="pg" style="padding:16px;background:var(--bg)" id="PC"></div>
</div>

<div class="btm-nav">
    <div class="btm-item active" data-p="dashboard" onclick="go('dashboard')"><i class="fas fa-home"></i><span>হোম</span></div>
    <div class="btm-item" data-p="sales" onclick="go('sales')"><i class="fas fa-cash-register"></i><span>বিক্রয়</span></div>
    <div class="btm-item" data-p="purchases" onclick="go('purchases')"><i class="fas fa-cart-plus"></i><span>ক্রয়</span></div>
    <div class="btm-item" data-p="stock" onclick="go('stock')"><i class="fas fa-warehouse"></i><span>স্টক</span></div>
    <div class="btm-item" onclick="document.getElementById('SB').classList.toggle('op')"><i class="fas fa-th-large"></i><span>মেনু</span></div>
</div>

<div class="mo" id="MO" onclick="if(event.target===this)cm()"><div class="mb" id="MB"></div></div>

<script>
var AU=localStorage.getItem("iqra_au")||"",cOk=false;
var defaultLogo = "https://z-cdn-media.chatglm.cn/files/dd565b75-991f-4a84-8d96-cfab5d0e3e9b.jpg?auth_key=1885589338-700267b87a3c4b1093fc380068c952bd-0-78b2fd629c8adc0e3145f74b396246ad";
var D={products:[],shops:[],sales:[],purchases:[],stockEntries:[],payments:[],logo:defaultLogo,pg:"dashboard"};
var DP=[{id:1,name:"পাউন্ড কেক",category:"কেক",price:250,unit:"পাউন্ড"},{id:2,name:"জার কেক",category:"কেক",price:180,unit:"পিছ"},{id:3,name:"কাপ কেক",category:"কেক",price:60,unit:"পিছ"},{id:4,name:"টকদই",category:"দই",price:40,unit:"পিছ"},{id:5,name:"মিস্টিদই",category:"দই",price:50,unit:"পিছ"},{id:6,name:"ঘি",category:"ঘি",price:800,unit:"কেজি"},{id:7,name:"বিস্কুট",category:"বেকারী",price:30,unit:"প্যাকেট"},{id:8,name:"রুটি",category:"বেকারী",price:10,unit:"পিছ"},{id:9,name:"বান",category:"বেকারী",price:15,unit:"পিছ"},{id:10,name:"কুকিজ",category:"বেকারী",price:120,unit:"প্যাকেট"}];
var DS=[{id:1,name:"আল-আমিন স্টোর",owner:"রহিম মিয়া",phone:"01711123456",address:"সদর বাজার"},{id:2,name:"ফাতেমা মার্কেট",owner:"করিম সাহেব",phone:"01812234567",address:"স্টেশন রোড"},{id:3,name:"হালিম ট্রেডার্স",owner:"হালিম",phone:"01913345678",address:"কলেজ গেট"},{id:4,name:"মদিনা সুপার শপ",owner:"ইসমাইল",phone:"01614456789",address:"নতুন বাজার"}];

function sv(){localStorage.setItem("iqra_d",JSON.stringify(D))}
function ld(){var d=localStorage.getItem("iqra_d");if(d){try{D=JSON.parse(d);if(!D.logo){D.logo=defaultLogo;sv();}if(!D.purchases)D.purchases=[];}catch(e){iD()}}else iD()}
function iD(){D.products=JSON.parse(JSON.stringify(DP));D.shops=JSON.parse(JSON.stringify(DS));D.purchases=[];D.stockEntries=DP.map(function(p){return{productId:p.id,qty:Math.floor(Math.random()*60)+20,date:td()}});D.sales=gDS();D.payments=gDP();D.logo=defaultLogo;sv()}
function gDS(){var s=[],n=new Date();for(var d=4;d>=0;d--){var dt=new Date(n);dt.setDate(dt.getDate()-d);var ds=dt.toISOString().split("T")[0];for(var i=0;i<Math.floor(Math.random()*3)+1;i++){var sh=DS[Math.floor(Math.random()*DS.length)];var items=[],us={};for(var j=0;j<Math.floor(Math.random()*3)+1;j++){var p;do{p=DP[Math.floor(Math.random()*DP.length)]}while(us[p.id]);us[p.id]=1;var q=Math.floor(Math.random()*10)+1;items.push({productId:p.id,name:p.name,qty:q,unit:p.unit,price:p.price,total:q*p.price,baseQty:q})}var gt=items.reduce(function(a,b){return a+b.total},0);var pd=Math.round(gt*(Math.random()>.5?1:.6));s.push({id:Date.now()-d*86400000+i*1000,date:ds,shopId:sh.id,shopName:sh.name,items:items,grandTotal:gt,paid:pd,due:gt-pd,method:pd>=gt?"ক্যাশ":"বাকি",note:""})}}return s}
function gDP(){var py=[];D.sales.filter(function(s){return s.due>0}).slice(0,2).forEach(function(s){py.push({id:Date.now()+Math.random()*1000,saleId:s.id,shopId:s.shopId,shopName:s.shopName,amount:Math.min(s.due,Math.round(s.due*.5)),date:td(),note:"আংশিক পরিশোধ"})});return py}

function sSt(v){var el=document.getElementById("SS2");if(!el)return;if(v==="ok"){el.innerHTML='<span class="sd so"></span>ক্লাউড';cOk=true}else if(v==="w"){el.innerHTML='<span class="sd sw"></span>সিঙ্ক...';cOk=false}else{el.innerHTML='<span class="sd se"></span>অফলাইন';cOk=false}}
function cG(){if(!AU)return null;try{sSt("w");var r=new XMLHttpRequest();r.open("GET",AU+"?action=getAll&t="+Date.now(),false);r.send();if(r.status!==200)throw new Error(r.status);var d=JSON.parse(r.responseText);if(d.error)throw new Error(d.error);sSt("ok");return d}catch(e){sSt("e");return null}}
function cP(a,data){if(!AU)return false;try{sSt("w");var r=new XMLHttpRequest();r.open("POST",AU,false);r.setRequestHeader("Content-Type","text/plain");r.send(JSON.stringify(Object.assign({action:a}, data)));if(r.status!==200)throw new Error(r.status);var d=JSON.parse(r.responseText);if(d.error)throw new Error(d.error);sSt("ok");return true}catch(e){sSt("e");return false}}
function cLd(){var d=cG();if(d){D.products=d.products||[];D.shops=d.shops||[];D.sales=(d.sales||[]).map(function(s){return Object.assign({},s,{items:typeof s.items==="string"?JSON.parse(s.items):s.items})});D.purchases=d.purchases||[];D.stockEntries=d.stockEntries||[];D.payments=d.payments||[];if(d.settings&&d.settings.logo)D.logo=d.settings.logo;sv()}}

function td(){return new Date().toISOString().split("T")[0]}
function fT(n){return "\u09F3"+Number(n||0).toLocaleString("bn-BD")}
function fD(d){if(!d)return "";return new Date(d+"T00:00:00").toLocaleDateString("bn-BD",{day:"numeric",month:"short",year:"numeric"})}
function nid(a){return a.length?Math.max.apply(null,a.map(function(i){return i.id}))+1:1}
function gP(id){for(var i=0;i<D.products.length;i++)if(D.products[i].id===id)return D.products[i];return null}
function gS(id){for(var i=0;i<D.shops.length;i++)if(D.shops[i].id===id)return D.shops[i];return null}
function gSt(pid){var t=0;for(var i=0;i<D.stockEntries.length;i++)if(D.stockEntries[i].productId===pid)t+=Number(D.stockEntries[i].qty);return Math.round(t*1000)/1000}
function gDue(sid){var td2=0,tp=0;for(var i=0;i<D.sales.length;i++)if(D.sales[i].shopId===sid)td2+=D.sales[i].due;for(var i=0;i<D.payments.length;i++)if(D.payments[i].shopId===sid)tp+=D.payments[i].amount;return Math.max(0,td2-tp)}
function tt(m,t){var c={ok:"#2E7D32",no:"#C62828",wn:"#E65100",in:"#00695C"};var ic={ok:"fa-check-circle",no:"fa-times-circle",wn:"fa-exclamation-triangle",in:"fa-info-circle"};var t2=document.createElement("div");t2.className="tt";t2.style.background=c[t||"ok"];t2.innerHTML='<i class="fas '+(ic[t||"ok"])+'" style="margin-right:6px"></i>'+m;document.getElementById("TC").appendChild(t2);setTimeout(function(){t2.remove()},2800)}

function hLogo(ev){var f=ev.target.files[0];if(!f)return;var cv=document.createElement("canvas");var rd=new FileReader();rd.onload=function(e){var img=new Image();img.onload=function(){var mx=400;var sc=mx/Math.max(img.width,img.height);cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);D.logo=cv.toDataURL("image/jpeg",0.8);sv();dLogo();cP("saveSetting",{key:"logo",value:D.logo});tt("লোগো সেভ হয়েছে")};img.src=e.target.result};rd.readAsDataURL(f);}
