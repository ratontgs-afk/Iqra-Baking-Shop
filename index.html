<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#FFF9F0;--fg:#2C1810;--mt:#8B7355;--ac:#D4880F;--cd:#FFF;--bd:#E8D5B7;--sb:#1A0F07;--ok:#2E7D32;--no:#C62828;--wn:#E65100;--in:#00695C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--sb);color:#F5E6D3;z-index:50;transition:transform .3s;overflow-y:auto}
.ni{display:flex;align-items:center;gap:11px;padding:11px 18px;margin:2px 8px;border-radius:10px;cursor:pointer;transition:all .2s;font-size:14px;font-weight:500;color:rgba(245,230,211,.55)}
.ni:hover{background:#3E2723;color:#F5E6D3}
.ni.ac{background:linear-gradient(135deg,var(--ac),#B8740A);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(212,136,15,.3)}
.ni i{width:20px;text-align:center;font-size:15px}
.mc{margin-left:250px;min-height:100vh}
.tb{position:sticky;top:0;z-index:40;background:rgba(255,249,240,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:20px;transition:box-shadow .25s;position:relative;overflow:hidden}
.cd:hover{box-shadow:0 6px 24px rgba(44,24,16,.07)}
.dt{width:100%;border-collapse:separate;border-spacing:0}
.dt th{background:#FDF6EC;padding:11px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--mt);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--bd)}
.dt td{padding:11px 12px;border-bottom:1px solid var(--bd);font-size:13px;vertical-align:middle}
.dt tr:hover{background:rgba(212,136,15,.03)}
.bt{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;border:none;transition:all .15s;font-family:inherit;white-space:nowrap}
.bp{background:linear-gradient(135deg,var(--ac),#B8740A);color:#fff;box-shadow:0 3px 10px rgba(212,136,15,.25)}
.bs{background:var(--cd);color:var(--fg);border:1px solid var(--bd)}
.bs:hover{border-color:var(--ac)}
.bd{background:var(--no);color:#fff}
.bg{background:var(--ok);color:#fff}
.bi{background:var(--in);color:#fff}
.sm{padding:4px 11px;font-size:12px;border-radius:7px}
.fi{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:9px;font-size:14px;font-family:inherit;background:var(--cd);color:var(--fg);outline:none}
.fi:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,136,15,.1)}
select.fi{cursor:pointer}
.fl{display:block;font-weight:600;font-size:12px;color:var(--mt);margin-bottom:4px}
.mo{position:fixed;inset:0;background:rgba(26,15,7,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mo.sh{opacity:1;pointer-events:auto}
.mb{background:var(--cd);border-radius:18px;padding:24px;width:92%;max-width:540px;max-height:85vh;overflow-y:auto;transform:scale(.95);transition:transform .2s;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.mo.sh .mb{transform:scale(1)}
.tc{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tt{padding:11px 15px;border-radius:10px;color:#fff;font-weight:500;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.12);animation:ti .3s ease;pointer-events:auto}
@keyframes ti{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
.bdg{display:inline-flex;padding:3px 8px;border-radius:14px;font-size:11px;font-weight:600}
.bo{background:#E8F5E9;color:var(--ok)}
.bn{background:#FFEBEE;color:var(--no)}
.bw{background:#FFF3E0;color:var(--wn)}
.bx{background:#E0F2F1;color:var(--in)}
.ps{animation:fu .3s ease}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sbr{height:7px;border-radius:4px;background:#F0E6D6;overflow:hidden}
.sbf{height:100%;border-radius:4px;transition:width .4s}
.lu{width:100px;height:100px;border-radius:20px;border:2px dashed rgba(212,136,15,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;flex-shrink:0;transition:all .3s ease}
.lu:hover{border-color:var(--ac);transform:scale(1.05);box-shadow:0 5px 15px rgba(212,136,15,.2)}
.lu img{width:100%;height:100%;object-fit:cover}
.lo{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;border-radius:18px}
.lu:hover .lo{opacity:1}
.sd{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.so{background:var(--ok)}
.se{background:var(--no)}
.sw{background:var(--wn);animation:pu 1s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.mt{display:none}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.op{transform:translateX(0)}.mc{margin-left:0}.mt{display:flex}.tb{padding:10px 14px}.pg{padding:14px!important}.sg{grid-template-columns:1fr!important}.rg{grid-template-columns:1fr!important}.dt{font-size:11px}.dt th,.dt td{padding:8px 6px}.mb{padding:18px;margin:8px}}
/* প্রিন্ট অপশনের জন্য স্টাইল */
#printArea { display: none; }
@media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
    @page { margin: 1cm; }
}
</style>
</head>
<body>
<div class="tc" id="TC"></div>
<div id="printArea"></div> <!-- প্রিন্টের জন্য হিডেন এরিয়া -->

<aside class="sidebar" id="SB">
<div style="padding:18px 14px 12px">
<div style="display:flex;align-items:center;gap:11px">
<div class="lu" onclick="document.getElementById('LF').click()">
<img id="LI" src="" alt="" style="display:none">
<i class="fas fa-bread-slice" id="LK" style="color:var(--ac);font-size:36px"></i>
<div class="lo"><i class="fas fa-camera" style="color:#fff;font-size:24px"></i></div>
</div>
<input type="file" id="LF" accept="image/*" style="display:none" onchange="hLogo(event)">
<div><div style="font-weight:900;font-size:20px;color:#FFF;line-height:1.1">Iqra</div><div style="font-size:11px;color:rgba(245,230,211,.4)">Baking Shop</div></div>
</div></div>
<div style="margin:0 14px 8px;border-bottom:1px solid rgba(245,230,211,.06)"></div>
<nav style="padding:8px 0">
<div class="ni ac" data-p="dashboard" onclick="go('dashboard')"><i class="fas fa-chart-pie"></i>ড্যাশবোর্ড</div>
<div class="ni" data-p="products" onclick="go('products')"><i class="fas fa-box"></i>পণ্য সমূহ</div>
<div class="ni" data-p="shops" onclick="go('shops')"><i class="fas fa-store"></i>দোকান সমূহ</div>
<div class="ni" data-p="sales" onclick="go('sales')"><i class="fas fa-cash-register"></i>বিক্রয়</div>
<div class="ni" data-p="purchases" onclick="go('purchases')"><i class="fas fa-cart-plus"></i>ক্রয়</div>
<div class="ni" data-p="stock" onclick="go('stock')"><i class="fas fa-warehouse"></i>স্টক</div>
<div class="ni" data-p="accounts" onclick="go('accounts')"><i class="fas fa-book"></i>হিসাব বই</div>
<div class="ni" data-p="reports" onclick="go('reports')"><i class="fas fa-file-invoice"></i>রিপোর্ট</div>
<div class="ni" data-p="settings" onclick="go('settings')"><i class="fas fa-gear"></i>সেটিংস</div>
</nav>
<div style="position:absolute;bottom:14px;left:14px;right:14px">
<div style="background:rgba(212,136,15,.08);border:1px solid rgba(212,136,15,.1);border-radius:10px;padding:10px;text-align:center">
<div style="font-size:9px;color:rgba(245,230,211,.3)">সেভ</div>
<div style="font-size:11px;color:var(--ac);font-weight:600" id="LS">-</div>
</div></div>
</aside>
<div class="mc">
<div id="BN" style="background:linear-gradient(135deg,#E65100,#BF360C);color:#fff;font-weight:800;border-radius:0;padding:12px 20px;display:none;align-items:center;justify-content:space-between;gap:12px;font-size:13px" class="np">
<div><i class="fas fa-cloud-arrow-up" style="margin-right:5px"></i>Google Sheets কানেক্ট করুন</div>
<button class="bt sm" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="go('settings')">সেটআপ</button>
</div>
<div class="tb">
<div style="display:flex;align-items:center;gap:10px;min-width:0">
<button class="mt bt bs sm" onclick="document.getElementById('SB').classList.toggle('op')"><i class="fas fa-bars"></i></button>
<div style="min-width:0"><h1 style="font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="PT">ড্যাশবোর্ড</h1><p style="font-size:10px;color:var(--mt)" id="PS">সারসংক্ষেপ</p></div>
</div>
<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
<span id="SS2" style="display:flex;align-items:center;font-size:10px;color:var(--mt)" class="np"><span class="sd se"></span>অফলাইন</span>
<button class="bt bs sm np" onclick="expD()"><i class="fas fa-download"></i></button>
<button class="bt bs sm np" onclick="printFullReport()"><i class="fas fa-print"></i></button>
</div>
</div>
<div class="pg" style="padding:18px;background:var(--bg)" id="PC"></div>
</div>
<div class="mo" id="MO" onclick="if(event.target===this)cm()"><div class="mb" id="MB"></div></div>
<script>
var AU=localStorage.getItem("iqra_au")||"",cOk=false;
var defaultLogo = "https://z-cdn-media.chatglm.cn/files/dd565b75-991f-4a84-8d96-cfab5d0e3e9b.jpg?auth_key=1885589338-700267b87a3c4b1093fc380068c952bd-0-78b2fd629c8adc0e3145f74b396246ad";
var D={products:[],shops:[],sales:[],purchases:[],stockEntries:[],payments:[],logo:defaultLogo,pg:"dashboard"};
var DP=[{id:1,name:"পাউন্ড কেক",category:"কেক",price:250,unit:"পাউন্ড"},{id:2,name:"জার কেক",category:"কেক",price:180,unit:"পিছ"},{id:3,name:"কাপ কেক",category:"কেক",price:60,unit:"পিছ"},{id:4,name:"টকদই",category:"দই",price:40,unit:"পিছ"},{id:5,name:"মিস্টিদই",category:"দই",price:50,unit:"পিছ"},{id:6,name:"ঘি",category:"ঘি",price:800,unit:"কেজি"},{id:7,name:"বিস্কুট",category:"বেকারী",price:30,unit:"প্যাকেট"},{id:8,name:"রুটি",category:"বেকারী",price:10,unit:"পিছ"},{id:9,name:"বান",category:"বেকারী",price:15,unit:"পিছ"},{id:10,name:"কুকিজ",category:"বেকারী",price:120,unit:"প্যাকেট"}];
var DS=[{id:1,name:"আল-আমিন স্টোর",owner:"রহিম মিয়া",phone:"01711123456",address:"সদর বাজার"},{id:2,name:"ফাতেমা মার্কেট",owner:"করিম সাহেব",phone:"01812234567",address:"স্টেশন রোড"},{id:3,name:"হালিম ট্রেডার্স",owner:"হালিম",phone:"01913345678",address:"কলেজ গেট"},{id:4,name:"মদিনা সুপার শপ",owner:"ইসমাইল",phone:"01614456789",address:"নতুন বাজার"}];

function sv(){localStorage.setItem("iqra_d",JSON.stringify(D));var el=document.getElementById("LS");if(el)el.textContent=new Date().toLocaleTimeString("bn-BD")}
function ld(){var d=localStorage.getItem("iqra_d");if(d){try{D=JSON.parse(d);if(!D.logo){D.logo=defaultLogo;sv();}if(!D.purchases)D.purchases=[];}catch(e){iD()}}else iD()}
function iD(){D.products=JSON.parse(JSON.stringify(DP));D.shops=JSON.parse(JSON.stringify(DS));D.purchases=[];D.stockEntries=DP.map(function(p){return{productId:p.id,qty:Math.floor(Math.random()*60)+20,date:td()}});D.sales=gDS();D.payments=gDP();D.logo=defaultLogo;sv()}
function gDS(){var s=[],n=new Date();for(var d=4;d>=0;d--){var dt=new Date(n);dt.setDate(dt.getDate()-d);var ds=dt.toISOString().split("T")[0];for(var i=0;i<Math.floor(Math.random()*3)+1;i++){var sh=DS[Math.floor(Math.random()*DS.length)];var items=[],us={};for(var j=0;j<Math.floor(Math.random()*3)+1;j++){var p;do{p=DP[Math.floor(Math.random()*DP.length)]}while(us[p.id]);us[p.id]=1;var q=Math.floor(Math.random()*10)+1;items.push({productId:p.id,name:p.name,qty:q,unit:p.unit,price:p.price,total:q*p.price,baseQty:q})}var gt=items.reduce(function(a,b){return a+b.total},0);var pd=Math.round(gt*(Math.random()>.5?1:.6));s.push({id:Date.now()-d*86400000+i*1000,date:ds,shopId:sh.id,shopName:sh.name,items:items,grandTotal:gt,paid:pd,due:gt-pd,method:pd>=gt?"ক্যাশ":"বাকি",note:""})}}return s}
function gDP(){var py=[];D.sales.filter(function(s){return s.due>0}).slice(0,2).forEach(function(s){py.push({id:Date.now()+Math.random()*1000,saleId:s.id,shopId:s.shopId,shopName:s.shopName,amount:Math.min(s.due,Math.round(s.due*.5)),date:td(),note:"আংশিক পরিশোধ"})});return py}

function sSt(v){var el=document.getElementById("SS2");if(!el)return;if(v==="ok"){el.innerHTML='<span class="sd so"></span>ক্লাউড';cOk=true}else if(v==="w"){el.innerHTML='<span class="sd sw"></span>সিঙ্ক...';cOk=false}else{el.innerHTML='<span class="sd se"></span>অফলাইন';cOk=false}}
function cG(){if(!AU)return null;try{sSt("w");var r=new XMLHttpRequest();r.open("GET",AU+"?action=getAll&t="+Date.now(),false);r.send();if(r.status!==200)throw new Error(r.status);var d=JSON.parse(r.responseText);if(d.error)throw new Error(d.error);sSt("ok");return d}catch(e){sSt("e");return null}}
function cP(a,data){if(!AU)return false;try{sSt("w");var r=new XMLHttpRequest();r.open("POST",AU,false);r.setRequestHeader("Content-Type","text/plain");r.send(JSON.stringify(Object.assign({action:a}, data)));if(r.status!==200)throw new Error(r.status);var d=JSON.parse(r.responseText);if(d.error)throw new Error(d.error);sSt("ok");return true}catch(e){sSt("e");return false}}
function cLd(){var d=cG();if(d){D.products=d.products||[];D.shops=d.shops||[];D.sales=(d.sales||[]).map(function(s){return Object.assign({},s,{items:typeof s.items==="string"?JSON.parse(s.items):s.items})});D.purchases=d.purchases||[];D.stockEntries=d.stockEntries||[];D.payments=d.payments||[];if(d.settings&&d.settings.logo)D.logo=d.settings.logo;sv()}document.getElementById("BN").style.display=AU?(cOk?"none":"flex"):"flex"}

function td(){return new Date().toISOString().split("T")[0]}
function fT(n){return "\u09F3"+Number(n||0).toLocaleString("bn-BD")}
function fD(d){if(!d)return "";return new Date(d+"T00:00:00").toLocaleDateString("bn-BD",{day:"numeric",month:"short",year:"numeric"})}
function nid(a){return a.length?Math.max.apply(null,a.map(function(i){return i.id}))+1:1}
function gP(id){for(var i=0;i<D.products.length;i++)if(D.products[i].id===id)return D.products[i];return null}
function gS(id){for(var i=0;i<D.shops.length;i++)if(D.shops[i].id===id)return D.shops[i];return null}
function gSt(pid){var t=0;for(var i=0;i<D.stockEntries.length;i++)if(D.stockEntries[i].productId===pid)t+=Number(D.stockEntries[i].qty);return Math.round(t*1000)/1000}
function gDue(sid){var td2=0,tp=0;for(var i=0;i<D.sales.length;i++)if(D.sales[i].shopId===sid)td2+=D.sales[i].due;for(var i=0;i<D.payments.length;i++)if(D.payments[i].shopId===sid)tp+=D.payments[i].amount;return Math.max(0,td2-tp)}
function tt(m,t){var c={ok:"#2E7D32",no:"#C62828",wn:"#E65100",in:"#00695C"};var ic={ok:"fa-check-circle",no:"fa-times-circle",wn:"fa-exclamation-triangle",in:"fa-info-circle"};var t2=document.createElement("div");t2.className="tt";t2.style.background=c[t||"ok"];t2.innerHTML='<i class="fas '+(ic[t||"ok"])+'" style="margin-right:6px"></i>'+m;document.getElementById("TC").appendChild(t2);setTimeout(function(){t2.remove()},2800)}

function hLogo(ev){
var f=ev.target.files[0];if(!f)return;
var cv=document.createElement("canvas");var rd=new FileReader();
rd.onload=function(e){var img=new Image();img.onload=function(){var mx=400;var sc=mx/Math.max(img.width,img.height);cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);D.logo=cv.toDataURL("image/jpeg",0.8);sv();dLogo();cP("saveSetting",{key:"logo",value:D.logo});tt("লোগো সেভ হয়েছে")};img.src=e.target.result};
rd.readAsDataURL(f);
}
